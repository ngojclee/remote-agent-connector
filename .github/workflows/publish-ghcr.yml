name: Test and publish GHCR images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: remote-agent-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Verify migrations ship inside the package
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import remote_agent_connector

          migrations = (
              Path(remote_agent_connector.__file__).resolve().parent
              / "migrations"
              / "sqlite"
          )
          files = sorted(p.name for p in migrations.glob("*.sql"))
          if not files:
              sys.exit(f"migrations missing from installed package: {migrations}")
          print("installed migrations:", files)
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Compile
        run: python -m compileall remote_agent_connector

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - name: Publish connector image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: relay-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=relay-latest,enable={{is_default_branch}}
            type=raw,value=relay-sha-{{sha}},enable={{is_default_branch}}
      - name: Publish WSS relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.relay-meta.outputs.tags }}
          labels: ${{ steps.relay-meta.outputs.labels }}
