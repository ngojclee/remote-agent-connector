[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-agent-connector"
version = "0.1.8"
description = "Typed Remote Agent connector between Business MCP Hub and client devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<46",
  "mcp==1.28.1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
remote-agent-connector = "remote_agent_connector.__main__:main"

[tool.setuptools.packages.find]
include = ["remote_agent_connector*"]

# Migrations are read at runtime from the installed package directory, so they
# must ship inside the wheel/image instead of being bind-mounted from a build
# tree.
[tool.setuptools.package-data]
remote_agent_connector = ["migrations/**/*.sql", "migrations/*.sql"]

[tool.setuptools]
include-package-data = true
