[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-agent-connector"
version = "0.1.0"
description = "Typed Remote Agent connector between Business MCP Hub and client devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<46",
  "mcp==1.28.1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
remote-agent-connector = "remote_agent_connector.__main__:main"

[tool.setuptools.packages.find]
include = ["remote_agent_connector*"]
