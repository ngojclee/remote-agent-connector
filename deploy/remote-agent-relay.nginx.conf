server {
    listen 8443 ssl;
    server_name 10.21.4.101;

    ssl_certificate /etc/remote-agent/tls/relay.crt;
    ssl_certificate_key /etc/remote-agent/tls/relay.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log off;
    error_log /dev/stderr warn;

    location = /relay {
        proxy_pass http://remote-agent-mcp-connector:3030/relay;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
        proxy_intercept_errors on;

        # A failed upgrade happens before the Python WebSocket handler can
        # send a protocol frame. Keep this response bounded and free of
        # upstream details.
        error_page 400 401 403 404 405 408 426 500 502 503 504 =502 @relay_upgrade_failed;
    }

    location / {
        return 404;
    }

    location @relay_upgrade_failed {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"v":1,"type":"error","error_contract":"business-mcp-remote-agent-relay-error-v1","code":"relay_upgrade_failed","stage":"upgrade","retryable":true,"message":"Relay WebSocket upgrade failed."}';
    }
}
